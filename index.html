<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Входящие заявки</title>
  <style>
    :root { color: #18352f; background: #f6f8f5; font: 1rem/1.55 system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 42rem; margin: clamp(2rem, 8vh, 5rem) auto; padding: 0 1.25rem; }
    h1 { margin: 0 0 1.25rem; font-size: clamp(1.9rem, 5vw, 2.65rem); line-height: 1.15; }
    form, section { padding: clamp(1rem, 4vw, 1.6rem); border: 1px solid #cbd6ce; border-radius: .75rem; background: white; }
    label, h2 { font-weight: 650; }
    textarea { display: block; width: 100%; margin: .5rem 0 1rem; padding: .75rem; border: 1px solid #84968a;
      border-radius: .35rem; color: inherit; font: inherit; resize: vertical; }
    button { padding: .65rem 1.1rem; border: 0; border-radius: .35rem; background: #185747; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #104536; }
    button:disabled { opacity: .65; cursor: progress; }
    :focus-visible { outline: 3px solid #287b86; outline-offset: 3px; }
    textarea[aria-invalid="true"] { border-color: #a84325; }
    #status { margin: 0; }
    #status:not(:empty) { margin: 1rem 0; }
    #status[data-state="manual"], #status[data-state="invalid"] { padding: .75rem 1rem; border-left: .25rem solid #a45b1b; background: #fff1dd; color: #64390f; }
    h2 { margin: 1rem 0 .35rem; font-size: 1.15rem; }
    section p { margin: 0; }
    #draft { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Входящие заявки</h1>
    <form>
      <label for="message">Текст заявки</label>
      <textarea id="message" rows="4" aria-describedby="status"></textarea>
      <button type="submit">Разобрать заявку</button>
    </form>
    <p id="status" role="status" aria-atomic="true"></p>
    <section id="result" aria-labelledby="draft-heading" hidden>
      <p>Тема заявки — <strong id="topic"></strong></p>
      <h2 id="draft-heading">Черновик ответа</h2>
      <p id="draft"></p>
    </section>
  </main>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const button = form.querySelector("button");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const labels = new Map([
      ["delivery", "Доставка"],
      ["pricing", "Стоимость"],
      ["other", "Другое"],
    ]);
    let pending;

    function showStatus(state, text) {
      status.dataset.state = state;
      status.textContent = text;
    }

    function clearResult() {
      pending?.abort();
      pending = undefined;
      button.disabled = false;
      result.hidden = true;
      topic.textContent = "";
      draft.textContent = "";
      message.removeAttribute("aria-invalid");
      showStatus("idle", "");
    }

    function showInvalid() {
      message.setAttribute("aria-invalid", "true");
      showStatus("invalid", "Введите текст заявки.");
      message.focus();
    }

    function showManual() {
      showStatus("manual", "Нужен ручной разбор. Прочитайте заявку и подготовьте ответ самостоятельно.");
    }

    message.addEventListener("input", clearResult);
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearResult();
      const text = message.value.trim();
      if (!text) return showInvalid();

      const request = new AbortController();
      pending = request;
      button.disabled = true;
      showStatus("pending", "Разбираем заявку…");
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: request.signal,
        });
        const data = await reply.json();
        if (request.signal.aborted) return;
        if (reply.status === 400 && data?.status === "invalid_input") return showInvalid();
        if (!reply.ok || data?.status !== "ready" || !labels.has(data.topic)
          || typeof data.draft !== "string" || !data.draft.trim()) {
          return showManual();
        }

        topic.textContent = labels.get(data.topic);
        draft.textContent = data.draft;
        result.hidden = false;
        showStatus("ready", "Черновик готов. Проверьте его перед отправкой.");
      } catch {
        if (!request.signal.aborted) showManual();
      } finally {
        if (!request.signal.aborted) {
          pending = undefined;
          button.disabled = false;
        }
      }
    });
  </script>
</body>
</html>
